name: Tang R9 One-Shot Real Godot GIF

on:
  push:
    branches:
      - task/pixel-complete-v6-r5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tang-r9-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current Tang branch
        uses: actions/checkout@v4

      - name: Install ffmpeg and virtual display
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg xvfb unzip

      - name: Download official Godot 4.7.2 Linux x86_64
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Import project and compile scripts
        run: |
          mkdir -p evidence/tang-r9-real
          /tmp/godot/godot --headless --editor --path . --quit-after 180 2>&1 | tee evidence/tang-r9-real/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' evidence/tang-r9-real/import.log

      - name: Record real current complete-game Tang R9 slice
        run: |
          xvfb-run -a /tmp/godot/godot --path . -s tests/tang_v6_movie.gd --write-movie evidence/tang-r9-real/tang-r9-real.avi 2>&1 | tee evidence/tang-r9-real/movie.log
          grep -q 'TANG_V6_MOVIE_DONE' evidence/tang-r9-real/movie.log
          test -s evidence/tang-r9-real/tang-r9-real.avi
          ! grep -E 'SCRIPT ERROR|Parse Error|Invalid get index|Invalid access' evidence/tang-r9-real/movie.log

      - name: Convert to quick GIF and MP4
        run: |
          ffmpeg -y -i evidence/tang-r9-real/tang-r9-real.avi -vf "fps=16,scale=768:-1:flags=neighbor,split[s0][s1];[s0]palettegen=max_colors=192[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3" evidence/tang-r9-real/tang-r9-real.gif
          ffmpeg -y -i evidence/tang-r9-real/tang-r9-real.avi -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p evidence/tang-r9-real/tang-r9-real.mp4
          ls -lh evidence/tang-r9-real/

      - name: Upload real Tang R9 preview
        uses: actions/upload-artifact@v4
        with:
          name: tang-r9-real-godot-preview
          path: |
            evidence/tang-r9-real/tang-r9-real.gif
            evidence/tang-r9-real/tang-r9-real.mp4
            evidence/tang-r9-real/movie.log
            evidence/tang-r9-real/import.log
          retention-days: 1
